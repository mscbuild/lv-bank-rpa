[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lv-bank-rpa"
version = "0.1.0"
description = "Local banking RPA for Latvian accounting workflows"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "PyYAML>=6.0,<7",
    "lxml>=5.2,<6",
    "httpx>=0.27,<1",
    "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
]

[project.scripts]
lv-bank-rpa = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
