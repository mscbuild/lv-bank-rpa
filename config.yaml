application:
  environment: production
  timezone: Europe/Riga

database:
  url: ${DATABASE_URL}

banks:

  swedbank:
    enabled: true

    accounts:
      - iban: ${SWEDBANK_IBAN}

    certificate:
      cert: ${SWEDBANK_CERT}
      key: ${SWEDBANK_KEY}

  seb:
    enabled: true

    accounts:
      - iban: ${SEB_IBAN}

    certificate:
      cert: ${SEB_CERT}
      key: ${SEB_KEY}

accounting:
  provider: zalktis

  zalktis:
    output_directory: ./data/outgoing/zalktis

scheduler:
  enabled: true
  interval_minutes: 60

security:
  verify_tls: true

runtime:
  dry_run: true
